# ============================================================================
# 축소판 설정 - 파이프라인 리허설/테스트 전용 (Week 3, 계획서 "reduced-scale rehearsal").
# Reduced-scale config for pipeline rehearsal and tests (Week 3).
#
# experiment_config.yaml 위에 덮어씌워 쓴다:
#   load_config("configs/experiment_config.yaml", overlay="configs/dev_config.yaml")
# ============================================================================

run_name: dev

# **축소 산출물은 별도 디렉터리에 쓴다.**
# 이 섹션이 없던 동안 make_dev_artefacts 가 운영과 같은 data/ 에 써서,
# 리허설 한 번이 Week 2 산출물(코퍼스 20만권, 분할, 검색 캐시)을 덮어썼다.
# 리허설의 목적은 "네트워크 없이 배선만 점검" 인데 점검하다가 본 데이터를 지웠다.
paths:
  data_dir: data/dev
  cache_dir: results/dev/cache
  log_dir: results/dev/logs
  figure_dir: results/dev/figures
  report_dir: results/dev/reports

data:
  corpus_size: 2000
  # 2,000 권 예산에 맞춘 질문 수. 산술:
  #   gold 400(질문당 1) + hard negative 400(200질문 x 2) = 800  -> remainder 1,200
  # corpus_size 만 줄이고 이걸 빼먹으면 실제 데이터에서 gold 54,129 > 2,000 으로
  # build_corpus 가 멈춘다.
  question_limit: 400
  hard_negatives_per_question: 2
  eval_set_size: 50
  gold_per_question_in_corpus: 1
  random_pool_size: 3000
  hard_negative_questions: 200
  bm25_pool_size: 3000

partition:
  num_clients: 2
  clustering:
    n_clusters: 16

retrieval:
  candidate_pool: 10

treatment:
  depths: [0, 10]
  seeds: [1]

model:
  max_seq_length: 384
  max_new_tokens: 16

train:
  batch_size: 2
  local_steps_per_round: 4
  total_local_steps: 24
  rounds: 6

federated:
  backend: inprocess

eval:
  round_schedule_dense_until: 6
  round_schedule_sparse_every: 1

gates:
  headroom:
    n_questions: 20
  monotonicity:
    n_questions: 50
  local_steps:
    candidate_K: [2, 4]
    probe_rounds: 1

cost:
  tau_sweep_points: 5
